inherit_from: .rubocop_todo.yml

require:
  - rubocop-rake
  - rubocop-rails
  - rubocop-performance

plugins:
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  NewCops: enable
  Exclude:
    - 'Gemfile'
    - 'Steepfile'
    - 'bin/rake'
    - 'bin/setup'
    - 'config.ru'
    - 'config/**/*.rb'
    - 'db/seeds.rb'
    - 'db/schema.rb'
    - 'db/migrate/*.rb'
    - 'spec/spec_helper.rb'
    - 'spec/rails_helper.rb'

Layout/LineLength:
  Max: 80

Layout/HashAlignment:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented_relative_to_receiver

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/ParallelAssignment:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/MultipleComparison:
  ComparisonsThreshold: 3

Style/Alias:
  EnforcedStyle: prefer_alias

Rails/DynamicFindBy:
  Enabled: false

Rails/HelperInstanceVariable:
  Exclude:
    - app/helpers/dragnet/type_view.rb

Naming/PredicateMethod:
  Exclude:
    - app/models/dragnet/meta_data.rb
